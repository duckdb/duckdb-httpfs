name: Bump DuckDB
on:
  workflow_dispatch:
    inputs:
      duckdb:
        description: 'DuckDB commit (full SHA) or tag to move to'
        required: true
        type: string
      duckdb-version:
        description: 'Label for commit and PR titles, e.g. v2.0.0'
        required: false
        type: string
        default: ''
      patches:
        description: "Comma-separated duckdb patch file names to apply"
        required: false
        type: string
        default: ''

# A newer DuckDB commit supersedes a run still in flight
concurrency:
  group: bump-duckdb-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: duckdb/duckdb-ci/bump-duckdb@main
        with:
          duckdb: ${{ inputs.duckdb }}
          duckdb-version: ${{ inputs.duckdb-version }}
          patches: ${{ inputs.patches }}
          token: ${{ secrets.DUCKDB_BUMP_TOKEN }}
