#
# This workflow calls the main distribution pipeline from DuckDB to build, test and (optionally) release the extension
#
name: Main Extension Distribution Pipeline
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' || github.sha }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ${{ github.repository_owner == 'duckdb' && 'namespace-profile-linux-slim' || 'ubuntu-slim' }}
    name: Prepare
    outputs:
      runners: ${{ steps.runners.outputs.runners }}
    steps:
      - name: Detect runners
        id: runners
        uses: duckdb/duckdb-ci/detect-runners@main

  duckdb-stable-build:
    name: Build extension binaries
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@main
    needs:
      - prepare
    with:
      extension_name: httpfs
      duckdb_version: c38d7e0739a7377f0c3f9eb8f4b7b87b000db433
      ci_tools_version: main
      runners: ${{ needs.prepare.outputs.runners }}

  duckdb-stable-deploy:
    name: Deploy extension binaries
    needs:
      - prepare
      - duckdb-stable-build
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_deploy.yml@main
    secrets: inherit
    with:
      extension_name: httpfs
      duckdb_version: c38d7e0739a7377f0c3f9eb8f4b7b87b000db433
      ci_tools_version: main
      deploy_latest: ${{ startsWith(github.ref, 'refs/heads/v') }}
      deploy_versioned: ${{ startsWith(github.ref, 'refs/heads/v') || github.ref == 'refs/heads/main' }}

  code-quality:
    name: Code Quality
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_code_quality.yml@main
    with:
      extension_name: httpfs
      duckdb_version: c38d7e0739a7377f0c3f9eb8f4b7b87b000db433
      ci_tools_version: main
      extra_toolchains: 'python3'
      format_checks: 'format'

  tidy:
    name: Tidy Check
    runs-on: ubuntu-24.04
    env:
      CC: gcc
      CXX: g++
      GEN: ninja
      TIDY_THREADS: 4
      TIDY_CHECKS: readability-convert-member-functions-to-static
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: 'recursive'
      - name: Install
        run: |
          sudo apt-get update -y -qq
          sudo apt-get install -y -qq ninja-build clang-tidy libcurl4-openssl-dev libssl-dev
          sudo pip3 install pybind11[global] --break-system-packages
      - name: Tidy Check
        run: make tidy-check

  relassert:
    name: Build relassert
    runs-on: ${{ github.repository_owner == 'duckdb' && 'namespace-profile-linux-x64' || 'ubuntu-latest' }}
    env:
      GEN: ninja
      CC: clang-20
      CXX: clang++-20
      # Enable -DDEBUG slow verifiers (expression verifier, operator
      # round-trips, etc.) without changing the optimization level.
      FORCE_DEBUG: 1
      FORCE_ASSERT: 1
      ASAN_OPTIONS: "detect_leaks=1:halt_on_error=1:abort_on_error=0"
      UBSAN_OPTIONS: "halt_on_error=1:print_stacktrace=1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: 'true'
      - name: Install tools
        run: python3 duckdb/scripts/ci/retry.py -- make -C duckdb toolsci
      - name: Fix ASan runtime
        # libclang_rt.asan_static.a is missing in ubuntu 24.04 — workaround
        # mirrored from upstream Main.yml.
        run: |
          asan_static_dir="/usr/lib/llvm-20/lib/clang/20/lib/x86_64-pc-linux-gnu"
          asan_static_target="/usr/lib/llvm-20/lib/clang/20/lib/linux/libclang_rt.asan_static-x86_64.a"
          if [[ ! -e "${asan_static_dir}/libclang_rt.asan_static.a" && -e "${asan_static_target}" ]]; then
            sudo mkdir -p "${asan_static_dir}"
            sudo ln -sf "${asan_static_target}" "${asan_static_dir}/libclang_rt.asan_static.a"
          fi
      - name: Setup Ccache
        uses: hendrikmuhs/ccache-action@main
        with:
          max-size: 5GB
          evict-old-files: job
      - name: Build (relassert → ASan + UBSan + LSan)
        uses: duckdb/duckdb-ci/build-duckdb@main
        with:
          build-type: relassert
          build: python3 duckdb/scripts/ci/retry.py -- make relassert
          test: make unittest_relassert
          vcpkg-commit: 84bab45d415d22042bd0b9081aea57f362da3f35
